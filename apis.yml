aid: adaraventurepartners
name: Adara Ventures
description: >-
  Adara Ventures (legally Adara Venture Partners S.a r.l., Luxembourg) is an
  early-stage European deep-tech venture capital firm founded in Madrid in 2005
  by Alberto Gomez and Nico Goulet. It backs technical founders from seed
  through growth with initial cheques of EUR 500k to EUR 5m across Europe (about
  75%) and the Americas (about 25%), and reports roughly EUR 350m under
  management, 60 companies backed, 12 exits and four fund generations (AV1 2006,
  AV2 2013, AV3 2019, an Opportunity Fund in 2022, and AV4 plus Adara Ventures
  Energy in 2025). The firm organises its thesis into four verticals it labels
  Capture, Secure, Compute and Connect - new data frontiers, trusted AI
  infrastructure, deep domain computation and real-world systems - which in
  practice means cybersecurity, applied AI, data infrastructure and energy
  transition. Portfolio companies include 42Crunch, Articul8, Quibim, SatVu,
  Seedtag, Stratio, XYZ Reality and Zymvol; exits include AlienVault (AT&T),
  PlayGiga (Meta), HDIV Security (Datadog) and Cyber Guru (Libraesva). Adara is
  an investor in API and developer-infrastructure companies rather than a
  publisher of APIs itself; it operates no developer program and no public API,
  but it does publish a detailed first-party /llms.txt for AI agents.
